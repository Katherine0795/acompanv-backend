name: Backend CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout código
      uses: actions/checkout@v4

    - name: Configurar JDK 24
      uses: actions/setup-java@v4
      with:
        java-version: '24'
        distribution: 'temurin'
        cache: maven

    - name: Build con Maven
      run: mvn clean package -DskipTests

    - name: Ejecutar tests
      run: mvn test

    - name: Subir artefacto (JAR)
      uses: actions/upload-artifact@v4
      with:
        name: backend-jar
        path: target/*.jar
