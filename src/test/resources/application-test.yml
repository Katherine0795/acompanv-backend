# Perfil de pruebas: base de datos H2 en memoria (no requiere MySQL)
spring:
  datasource:
    url: jdbc:h2:mem:acompav_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: create-drop
